<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>鼠标移动调试</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-area {
            width: 600px;
            height: 400px;
            border: 2px solid #4a9eff;
            background: #0f0f1e;
            position: relative;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .test-area:hover {
            border-color: #00ff88;
        }
        .info {
            background: #2a2a4e;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 10px;
            font-weight: bold;
        }
        .status-ok { background: #00ff88; color: #000; }
        .status-fail { background: #ff4444; color: #fff; }
        .log {
            background: #1e1e3e;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 12px;
        }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #3a3a5e;
        }
        .log-time { color: #888; margin-right: 10px; }
        .log-info { color: #4a9eff; }
        .log-warn { color: #ffaa00; }
        .log-error { color: #ff4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖱️ 鼠标移动调试工具</h1>

        <div class="info">
            <h3>状态检查</h3>
            <div>坐标显示: <span id="status-coord" class="status status-fail">未测试</span></div>
            <div>鼠标事件: <span id="status-mouse" class="status status-fail">未测试</span></div>
            <div>WebSocket: <span id="status-ws" class="status status-fail">未测试</span></div>
        </div>

        <div class="test-area" id="testArea">
            <span>移动鼠标到这里</span>
        </div>

        <div class="info">
            <h3>鼠标信息</h3>
            <div>客户端坐标: <span id="client-coords">(-, -)</span></div>
            <div>相对坐标: <span id="relative-coords">(-, -)</span></div>
            <div>映射坐标: <span id="mapped-coords">(-, -)</span></div>
            <div>移动距离: <span id="distance">0.00 px</span></div>
        </div>

        <div class="info">
            <h3>测试设置</h3>
            <div>
                <label>坐标变化阈值 (px):</label>
                <input type="number" id="threshold" value="3" min="1" max="50" style="width: 60px;">
            </div>
            <div>
                <label>图像尺寸 (模拟):</label>
                <input type="text" id="image-size" value="1920x1080" style="width: 100px;">
            </div>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        const logDiv = document.getElementById('log');
        const testArea = document.getElementById('testArea');
        const lastSent = { x: null, y: null };
        let eventCount = 0;

        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">${time}</span><span class="log-${type}">${message}</span>`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(id, ok) {
            const el = document.getElementById(id);
            el.textContent = ok ? '✓ 正常' : '✗ 异常';
            el.className = 'status ' + (ok ? 'status-ok' : 'status-fail');
        }

        function calculateCoords(event) {
            const rect = testArea.getBoundingClientRect();
            const clientX = event.clientX;
            const clientY = event.clientY;
            const relX = Math.round(clientX - rect.left);
            const relY = Math.round(clientY - rect.top);

            // 模拟映射到 1920x1080
            const sizeInput = document.getElementById('image-size').value;
            const [naturalWidth, naturalHeight] = sizeInput.split('x').map(Number);
            const scaleX = naturalWidth / rect.width;
            const scaleY = naturalHeight / rect.height;
            const mappedX = Math.round(relX * scaleX);
            const mappedY = Math.round(relY * scaleY);

            // 计算距离
            const distance = Math.sqrt(
                Math.pow(mappedX - lastSent.x, 2) +
                Math.pow(mappedY - lastSent.y, 2)
            );

            const threshold = parseInt(document.getElementById('threshold').value);

            // 更新显示
            document.getElementById('client-coords').textContent = `(${clientX}, ${clientY})`;
            document.getElementById('relative-coords').textContent = `(${relX}, ${relY})`;
            document.getElementById('mapped-coords').textContent = `(${mappedX}, ${mappedY})`;
            document.getElementById('distance').textContent = `${distance.toFixed(2)} px`;

            return { mappedX, mappedY, distance, threshold };
        }

        testArea.addEventListener('mousemove', (event) => {
            eventCount++;
            const coords = calculateCoords(event);

            log(`#${eventCount} 鼠标移动 (${coords.mappedX}, ${coords.mappedY}), 距离: ${coords.distance.toFixed(2)}`);

            if (lastSent.x === null || coords.distance >= coords.threshold) {
                log(`→ 距离 ≥ 阈值，将发送坐标 (${coords.mappedX}, ${coords.mappedY})`, 'info');
                lastSent.x = coords.mappedX;
                lastSent.y = coords.mappedY;
            } else {
                log(`→ 距离 < 阈值，忽略 (${coords.distance.toFixed(2)} < ${coords.threshold})`, 'warn');
            }

            updateStatus('status-coord', true);
        });

        testArea.addEventListener('mouseenter', () => {
            log('鼠标进入测试区域', 'info');
            updateStatus('status-mouse', true);
        });

        testArea.addEventListener('mouseleave', () => {
            log('鼠标离开测试区域', 'info');
            lastSent.x = null;
            lastSent.y = null;
        });

        // 检测 WebSocket
        if (typeof WebSocket !== 'undefined') {
            updateStatus('status-ws', true);
            log('WebSocket API 可用', 'info');
        } else {
            log('WebSocket API 不可用', 'error');
            updateStatus('status-ws', false);
        }

        log('调试工具已就绪', 'info');
    </script>
</body>
</html>
